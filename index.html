<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Breakout Game</title>
    <style>
        /* ----- RESET & GLOBAL ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: #0b0e1a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* ----- KONTAINER UTAMA ----- */
        .game-wrapper {
            background: #141828;
            padding: 24px 30px 30px;
            border-radius: 28px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7), 0 0 0 2px #2a3142 inset;
            max-width: 840px;
            width: 100%;
        }

        /* ----- 5 LOGO DI ATAS (revisi ukuran & responsif) ----- */
        .logos {
            display: flex;
            justify-content: center;
            gap: 28px;
            margin-bottom: 14px;
            flex-wrap: wrap;
        }

        .logo-item {
            width: 60px;
            height: 60px;
            object-fit: contain;
            line-height: 1;
            transition: transform 0.2s ease, filter 0.2s ease;
            cursor: default;
            filter: drop-shadow(0 2px 6px rgba(255, 255, 255, 0.15));
        }

        /* ----- HEADER (skor & nyawa) ----- */
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 6px 16px 6px;
            color: #c8d0e6;
            font-weight: 600;
            font-size: 1.2rem;
            letter-spacing: 0.5px;
        }

        .game-header .score span {
            color: #f7e05e;
            font-size: 1.6rem;
            margin-left: 6px;
        }

        .game-header .lives span {
            color: #ff6b7c;
            font-size: 1.6rem;
            margin-left: 6px;
        }

        /* ----- CANVAS ----- */
        #gameCanvas {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 780 / 500;
            background: #1b212f;
            border-radius: 16px;
            box-shadow: 0 0 0 2px #2f384e, 0 10px 30px rgba(0, 0, 0, 0.6);
            cursor: none;
            touch-action: none;
        }

        /* ----- TOMBOL KONTROL ----- */
        .game-controls {
            display: flex;
            justify-content: center;
            gap: 18px;
            margin-top: 18px;
            flex-wrap: wrap;
        }

        .game-controls button {
            background: #262f42;
            border: none;
            border-radius: 40px;
            color: #d0d9f0;
            font-size: 1.1rem;
            font-weight: 600;
            padding: 10px 28px;
            cursor: pointer;
            box-shadow: 0 6px 0 #10141f, 0 4px 12px rgba(0, 0, 0, 0.4);
            transition: all 0.08s ease;
            letter-spacing: 0.3px;
        }

        .game-controls button:active {
            transform: translateY(5px);
            box-shadow: 0 1px 0 #10141f;
        }

        .game-controls button:hover {
            background: #2f3a52;
            color: #ffffff;
        }

        /* Tombol mute */
        .game-controls .mute-btn {
            background: #1f2838;
            font-size: 1.1rem;
            padding: 10px 20px;
        }
        .game-controls .mute-btn:hover {
            background: #2f3a52;
        }

        /* ----- RESPONSIVE ----- */
        @media (max-width: 840px) {
            .game-wrapper { padding: 16px 16px 20px; border-radius: 20px; }
            .game-header { font-size: 1rem; padding-bottom: 12px; }
            .game-header .score span,
            .game-header .lives span { font-size: 1.3rem; }
            .logos { gap: 18px; margin-bottom: 10px; }
            .logo-item {
                width: 45px;
                height: 45px;
            }
            .game-controls button { padding: 8px 20px; font-size: 1rem; }
        }

        @media (max-width: 480px) {
            .game-wrapper { padding: 10px 10px 14px; border-radius: 14px; }
            .game-header { font-size: 0.85rem; padding-bottom: 8px; flex-wrap: wrap; gap: 4px; }
            .game-header .score span,
            .game-header .lives span { font-size: 1.1rem; }
            .logos { gap: 10px; margin-bottom: 6px; }
            .logo-item {
                width: 35px;
                height: 35px;
            }
            .game-controls { gap: 10px; }
            .game-controls button { padding: 6px 14px; font-size: 0.85rem; }
        }
    </style>
</head>
<body>

    <div class="game-wrapper">

        <!-- ===== 5 LOGO DI ATAS ===== -->
        <div class="logos">
            <img src="h.jpeg" alt="Logo 1" class="logo-item">
            <img src="one.jpeg" alt="Logo 2" class="logo-item">
            <img src="rpl.jpeg" alt="Logo 3" class="logo-item">
            <img src="smk.jpeg" alt="Logo 4" class="logo-item">
            <img src="mk.jpeg" alt="Logo 5" class="logo-item">
        </div>

        <!-- Header Skor & Nyawa -->
        <div class="game-header">
            <div class="score">🏆 Skor <span id="scoreDisplay">0</span></div>
            <div class="lives">❤️ Nyawa <span id="livesDisplay">3</span></div>
        </div>

        <!-- Canvas Game -->
        <canvas id="gameCanvas" width="780" height="500"></canvas>

        <!-- Tombol Kontrol -->
        <div class="game-controls">
            <button id="resetBtn">🔄 Mulai Ulang</button>
            <button id="pauseBtn">⏸️ Jeda</button>
            <button id="muteBtn" class="mute-btn">🔊 Suara</button>
        </div>

    </div>

    <script>
        // ============================================================
        //  BREAKOUT — DENGAN SOUND EFFECT
        // ============================================================

        (function() {
            'use strict';

            // ----- CANVAS & KONTEKS -----
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const W = 780,
                H = 500;

            // ----- ELEMEN HTML -----
            const scoreSpan = document.getElementById('scoreDisplay');
            const livesSpan = document.getElementById('livesDisplay');
            const resetBtn = document.getElementById('resetBtn');
            const pauseBtn = document.getElementById('pauseBtn');
            const muteBtn = document.getElementById('muteBtn');

            // ============================================================
            //  SOUND ENGINE (Web Audio API)
            // ============================================================
            let audioCtx = null;
            let isMuted = false;

            function initAudio() {
                if (!audioCtx) {
                    audioCtx = new(window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
            }

            // Fungsi untuk memainkan nada pendek
            function playTone(freq, duration, type = 'square', volume = 0.15) {
                if (isMuted) return;
                try {
                    initAudio();
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = type;
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(volume, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + duration);
                } catch (e) {
                    // Fallback silent jika audio error
                }
            }

            // Sound: Pantulan paddle (nada rendah)
            function soundPaddle() {
                playTone(320, 0.08, 'square', 0.12);
            }

            // Sound: Pantulan brick (nada sedang)
            function soundBrick(freq = 520) {
                playTone(freq, 0.10, 'square', 0.10);
            }

            // Sound: Kehilangan nyawa (nada turun)
            function soundLose() {
                playTone(300, 0.20, 'sawtooth', 0.15);
                setTimeout(() => playTone(200, 0.25, 'sawtooth', 0.12), 120);
            }

            // Sound: Game Over (nada turun panjang)
            function soundGameOver() {
                playTone(400, 0.20, 'sawtooth', 0.15);
                setTimeout(() => playTone(300, 0.25, 'sawtooth', 0.13), 150);
                setTimeout(() => playTone(200, 0.40, 'sawtooth', 0.12), 350);
            }

            // Sound: Menang (nada naik)
            function soundWin() {
                playTone(523, 0.15, 'square', 0.12);
                setTimeout(() => playTone(659, 0.15, 'square', 0.12), 130);
                setTimeout(() => playTone(784, 0.25, 'square', 0.14), 260);
            }

            // Sound: Dinding (nada pendek)
            function soundWall() {
                playTone(440, 0.06, 'square', 0.08);
            }

            // Toggle mute
            function toggleMute() {
                isMuted = !isMuted;
                muteBtn.textContent = isMuted ? '🔇 Suara' : '🔊 Suara';
                if (!isMuted) {
                    // Aktifkan audio context jika dimatikan
                    initAudio();
                }
            }

            // ----- KONSTANTA GAME -----
            const PADDLE_WIDTH = 110;
            const PADDLE_HEIGHT = 16;
            const PADDLE_RADIUS = 8;
            const BALL_RADIUS = 9;
            const BALL_SPEED_INIT = 5.0;
            const BALL_SPEED_MAX = 9.0;
            const BALL_SPEED_INCREMENT = 0.25;

            const BRICK_COLS = 8;
            const BRICK_ROWS = 6;
            const BRICK_WIDTH = 78;
            const BRICK_HEIGHT = 22;
            const BRICK_PADDING = 6;
            const BRICK_TOP_OFFSET = 50;

            const BRICK_COLORS = [
                '#f94144', '#f8961e', '#f9c74f',
                '#90be6d', '#577590', '#9b5de5'
            ];

            // ----- STATE GAME -----
            let paddle = { x: W / 2 - PADDLE_WIDTH / 2, y: H - 40 };
            let ball = { x: W / 2, y: H - 60, dx: 0, dy: 0, radius: BALL_RADIUS };
            let bricks = [];
            let score = 0;
            let lives = 3;
            let gameState = 'playing';
            let animationId = null;
            let isGameLoopRunning = false;

            let keys = { left: false, right: false };

            // Flag untuk menghindari spam suara
            let lastBrickHit = 0;
            let lastPaddleHit = 0;
            let lastWallHit = 0;

            // ----- INISIALISASI BRICK -----
            function initBricks() {
                bricks = [];
                for (let row = 0; row < BRICK_ROWS; row++) {
                    for (let col = 0; col < BRICK_COLS; col++) {
                        const x = col * (BRICK_WIDTH + BRICK_PADDING) + BRICK_PADDING / 2;
                        const y = row * (BRICK_HEIGHT + BRICK_PADDING) + BRICK_PADDING / 2 + BRICK_TOP_OFFSET;
                        bricks.push({
                            x: x,
                            y: y,
                            w: BRICK_WIDTH,
                            h: BRICK_HEIGHT,
                            alive: true,
                            color: BRICK_COLORS[row % BRICK_COLORS.length],
                            row: row
                        });
                    }
                }
            }

            // ----- RESET BOLA -----
            function resetBall(direction) {
                ball.x = paddle.x + PADDLE_WIDTH / 2;
                ball.y = paddle.y - BALL_RADIUS;
                const angle = (Math.random() * 0.8 + 0.2) * (direction || 1);
                ball.dx = BALL_SPEED_INIT * Math.cos(angle) * (Math.random() > 0.5 ? 1 : -1);
                ball.dy = -BALL_SPEED_INIT * Math.sin(angle);
                if (Math.abs(ball.dx) < 1.2) {
                    ball.dx = 1.8 * (ball.dx > 0 ? 1 : -1);
                }
            }

            // ----- RESET GAME -----
            function resetGame() {
                if (animationId) {
                    cancelAnimationFrame(animationId);
                    animationId = null;
                    isGameLoopRunning = false;
                }

                paddle.x = W / 2 - PADDLE_WIDTH / 2;
                paddle.y = H - 40;

                score = 0;
                lives = 3;
                gameState = 'playing';
                pauseBtn.textContent = '⏸️ Jeda';

                initBricks();
                resetBall(1);
                updateUI();

                if (!isGameLoopRunning) {
                    isGameLoopRunning = true;
                    gameLoop();
                }
            }

            // ----- UPDATE UI -----
            function updateUI() {
                scoreSpan.textContent = score;
                livesSpan.textContent = lives;
            }

            // ----- PAUSE TOGGLE -----
            function togglePause() {
                if (gameState === 'gameover' || gameState === 'win') return;
                if (gameState === 'playing') {
                    gameState = 'paused';
                    pauseBtn.textContent = '▶️ Mainkan';
                } else if (gameState === 'paused') {
                    gameState = 'playing';
                    pauseBtn.textContent = '⏸️ Jeda';
                }
            }

            // ----- DETEKSI TABRAKAN -----
            function ballBrickCollision(brick) {
                const cx = ball.x,
                    cy = ball.y;
                const closestX = Math.max(brick.x, Math.min(cx, brick.x + brick.w));
                const closestY = Math.max(brick.y, Math.min(cy, brick.y + brick.h));
                const distX = cx - closestX;
                const distY = cy - closestY;
                return Math.sqrt(distX * distX + distY * distY) < ball.radius;
            }

            function ballPaddleCollision() {
                const px = paddle.x,
                    py = paddle.y;
                const cx = ball.x,
                    cy = ball.y,
                    r = ball.radius;
                const closestX = Math.max(px, Math.min(cx, px + PADDLE_WIDTH));
                const closestY = Math.max(py, Math.min(cy, py + PADDLE_HEIGHT));
                const distX = cx - closestX;
                const distY = cy - closestY;

                if (Math.sqrt(distX * distX + distY * distY) < r) {
                    const hitPos = (ball.x - paddle.x) / PADDLE_WIDTH;
                    const clamped = Math.max(0, Math.min(1, hitPos));
                    const angle = (clamped - 0.5) * 1.2;
                    const speed = Math.min(BALL_SPEED_MAX,
                        Math.sqrt(ball.dx * ball.dx + ball.dy * ball.dy) + BALL_SPEED_INCREMENT
                    );
                    ball.dx = speed * Math.sin(angle);
                    ball.dy = -speed * Math.cos(angle);
                    ball.y = paddle.y - ball.radius - 1;

                    // SUARA: Pantulan paddle
                    soundPaddle();
                    return true;
                }
                return false;
            }

            // ----- UPDATE FISIKA -----
            function updatePhysics() {
                if (gameState !== 'playing') return;

                ball.x += ball.dx;
                ball.y += ball.dy;

                // Pantulan dinding kiri/kanan
                if (ball.x - ball.radius < 0) {
                    ball.x = ball.radius;
                    ball.dx = -ball.dx;
                    soundWall();
                } else if (ball.x + ball.radius > W) {
                    ball.x = W - ball.radius;
                    ball.dx = -ball.dx;
                    soundWall();
                }
                // Pantulan atas
                if (ball.y - ball.radius < 0) {
                    ball.y = ball.radius;
                    ball.dy = -ball.dy;
                    soundWall();
                }

                // Bola jatuh
                if (ball.y + ball.radius > H) {
                    lives--;
                    updateUI();
                    soundLose();
                    if (lives <= 0) {
                        gameState = 'gameover';
                        pauseBtn.textContent = '🔄 Main Lagi';
                        soundGameOver();
                        return;
                    } else {
                        resetBall(1);
                        ball.x = paddle.x + PADDLE_WIDTH / 2;
                        ball.y = paddle.y - ball.radius;
                        return;
                    }
                }

                // Pantulan paddle
                ballPaddleCollision();

                // Pantulan brick
                const now = Date.now();
                for (let i = 0; i < bricks.length; i++) {
                    const brick = bricks[i];
                    if (!brick.alive) continue;
                    if (ballBrickCollision(brick)) {
                        brick.alive = false;
                        score += 10 + (BRICK_ROWS - brick.row) * 2;
                        updateUI();

                        // SUARA: Pantulan brick (dengan nada berbeda per baris)
                        const freq = 400 + brick.row * 60;
                        soundBrick(freq);

                        const overlapX = (ball.x < brick.x + brick.w / 2) ?
                            (ball.x + ball.radius - brick.x) :
                            (brick.x + brick.w - (ball.x - ball.radius));
                        const overlapY = (ball.y < brick.y + brick.h / 2) ?
                            (ball.y + ball.radius - brick.y) :
                            (brick.y + brick.h - (ball.y - ball.radius));

                        if (overlapX < overlapY) {
                            ball.dx = -ball.dx;
                        } else {
                            ball.dy = -ball.dy;
                        }

                        const allDead = bricks.every(b => !b.alive);
                        if (allDead) {
                            gameState = 'win';
                            pauseBtn.textContent = '🎉 Menang!';
                            soundWin();
                        }
                        break;
                    }
                }

                // Gerakan paddle
                const PADDLE_SPEED = 7;
                if (keys.left && paddle.x > 0) {
                    paddle.x -= PADDLE_SPEED;
                    if (paddle.x < 0) paddle.x = 0;
                }
                if (keys.right && paddle.x + PADDLE_WIDTH < W) {
                    paddle.x += PADDLE_SPEED;
                    if (paddle.x + PADDLE_WIDTH > W) paddle.x = W - PADDLE_WIDTH;
                }
            }

            // ----- GAMBAR -----
            function draw() {
                ctx.clearRect(0, 0, W, H);

                // Brick
                for (const brick of bricks) {
                    if (!brick.alive) continue;
                    ctx.shadowColor = 'rgba(255,255,255,0.15)';
                    ctx.shadowBlur = 8;
                    ctx.fillStyle = brick.color;
                    const x = brick.x,
                        y = brick.y,
                        w = brick.w,
                        h = brick.h;
                    const r = 4;
                    ctx.beginPath();
                    ctx.moveTo(x + r, y);
                    ctx.lineTo(x + w - r, y);
                    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
                    ctx.lineTo(x + w, y + h - r);
                    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
                    ctx.lineTo(x + r, y + h);
                    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
                    ctx.lineTo(x, y + r);
                    ctx.quadraticCurveTo(x, y, x + r, y);
                    ctx.closePath();
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.strokeStyle = 'rgba(255,255,255,0.25)';
                    ctx.lineWidth = 1.2;
                    ctx.stroke();
                }

                // Paddle
                ctx.shadowColor = 'rgba(255,255,255,0.25)';
                ctx.shadowBlur = 18;
                const grad = ctx.createLinearGradient(paddle.x, paddle.y, paddle.x, paddle.y + PADDLE_HEIGHT);
                grad.addColorStop(0, '#7f9cf5');
                grad.addColorStop(1, '#4f6cdb');
                ctx.fillStyle = grad;
                ctx.beginPath();
                const px = paddle.x,
                    py = paddle.y,
                    pw = PADDLE_WIDTH,
                    ph = PADDLE_HEIGHT,
                    rad = PADDLE_RADIUS;
                ctx.moveTo(px + rad, py);
                ctx.lineTo(px + pw - rad, py);
                ctx.quadraticCurveTo(px + pw, py, px + pw, py + rad);
                ctx.lineTo(px + pw, py + ph - rad);
                ctx.quadraticCurveTo(px + pw, py + ph, px + pw - rad, py + ph);
                ctx.lineTo(px + rad, py + ph);
                ctx.quadraticCurveTo(px, py + ph, px, py + ph - rad);
                ctx.lineTo(px, py + rad);
                ctx.quadraticCurveTo(px, py, px + rad, py);
                ctx.closePath();
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.fillStyle = 'rgba(255,255,255,0.2)';
                ctx.beginPath();
                ctx.rect(px + 12, py + 2, pw - 24, 5);
                ctx.fill();

                // Bola
                ctx.shadowColor = '#a0c4ff';
                ctx.shadowBlur = 28;
                ctx.beginPath();
                ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
                const gradBall = ctx.createRadialGradient(
                    ball.x - 3, ball.y - 4, 2,
                    ball.x, ball.y, ball.radius + 2
                );
                gradBall.addColorStop(0, '#ffffff');
                gradBall.addColorStop(0.5, '#b8d4ff');
                gradBall.addColorStop(1, '#5a8cdf');
                ctx.fillStyle = gradBall;
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.fillStyle = 'rgba(255,255,255,0.7)';
                ctx.beginPath();
                ctx.arc(ball.x - 2.5, ball.y - 3.5, 3, 0, Math.PI * 2);
                ctx.fill();

                // Status overlay
                ctx.shadowBlur = 0;
                ctx.font = 'bold 34px "Segoe UI", sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';

                if (gameState === 'paused') {
                    ctx.fillStyle = 'rgba(0,0,0,0.5)';
                    ctx.fillRect(0, 0, W, H);
                    ctx.fillStyle = '#f0f4ff';
                    ctx.shadowColor = 'rgba(0,0,0,0.6)';
                    ctx.shadowBlur = 20;
                    ctx.fillText('⏸️ JEDA', W / 2, H / 2);
                } else if (gameState === 'gameover') {
                    ctx.fillStyle = 'rgba(0,0,0,0.6)';
                    ctx.fillRect(0, 0, W, H);
                    ctx.fillStyle = '#ff6b7c';
                    ctx.shadowColor = '#ff3b4a';
                    ctx.shadowBlur = 30;
                    ctx.fillText('💔 GAME OVER', W / 2, H / 2 - 20);
                    ctx.font = '20px "Segoe UI", sans-serif';
                    ctx.fillStyle = '#d0d9f0';
                    ctx.shadowBlur = 10;
                    ctx.fillText('Tekan "Mulai Ulang"', W / 2, H / 2 + 40);
                } else if (gameState === 'win') {
                    ctx.fillStyle = 'rgba(0,0,0,0.5)';
                    ctx.fillRect(0, 0, W, H);
                    ctx.fillStyle = '#f7e05e';
                    ctx.shadowColor = '#f7d44a';
                    ctx.shadowBlur = 40;
                    ctx.fillText('🎉 SELAMAT!', W / 2, H / 2 - 20);
                    ctx.font = '22px "Segoe UI", sans-serif';
                    ctx.fillStyle = '#d0d9f0';
                    ctx.shadowBlur = 10;
                    ctx.fillText('Skor akhir: ' + score, W / 2, H / 2 + 40);
                }

                ctx.shadowBlur = 0;
                ctx.shadowColor = 'transparent';
            }

            // ----- GAME LOOP -----
            function gameLoop() {
                if (!isGameLoopRunning) return;
                updatePhysics();
                draw();
                animationId = requestAnimationFrame(gameLoop);
            }

            // ----- EVENT LISTENER -----
            window.addEventListener('keydown', function(e) {
                const key = e.key;
                if (key === 'ArrowLeft' || key === 'Left' || key === 'a' || key === 'A') {
                    keys.left = true;
                    e.preventDefault();
                } else if (key === 'ArrowRight' || key === 'Right' || key === 'd' || key === 'D') {
                    keys.right = true;
                    e.preventDefault();
                } else if (key === ' ' || key === 'Space') {
                    e.preventDefault();
                    togglePause();
                } else if (key === 'r' || key === 'R') {
                    resetGame();
                } else if (key === 'm' || key === 'M') {
                    toggleMute();
                }
            });

            window.addEventListener('keyup', function(e) {
                const key = e.key;
                if (key === 'ArrowLeft' || key === 'Left' || key === 'a' || key === 'A') {
                    keys.left = false;
                    e.preventDefault();
                } else if (key === 'ArrowRight' || key === 'Right' || key === 'd' || key === 'D') {
                    keys.right = false;
                    e.preventDefault();
                }
            });

            function handleMove(e) {
                if (gameState === 'gameover' || gameState === 'win') return;
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                let clientX;
                if (e.touches) {
                    clientX = e.touches[0].clientX;
                    e.preventDefault();
                } else {
                    clientX = e.clientX;
                }
                const canvasX = (clientX - rect.left) * scaleX;
                const clamped = Math.max(0, Math.min(W - PADDLE_WIDTH, canvasX - PADDLE_WIDTH / 2));
                paddle.x = clamped;
            }

            canvas.addEventListener('mousemove', handleMove);
            canvas.addEventListener('touchmove', handleMove, { passive: false });
            canvas.addEventListener('touchstart', handleMove, { passive: false });

            // ----- TOMBOL -----
            resetBtn.addEventListener('click', resetGame);
            pauseBtn.addEventListener('click', togglePause);
            muteBtn.addEventListener('click', toggleMute);

            // ----- MULAI GAME -----
            resetGame();

            // Inisialisasi audio saat user berinteraksi pertama kali
            document.addEventListener('click', function initAudioOnClick() {
                initAudio();
                document.removeEventListener('click', initAudioOnClick);
            }, { once: true });

            // Prevent scroll
            window.addEventListener('keydown', function(e) {
                if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' ', 'Space'].includes(e.key)) {
                    e.preventDefault();
                }
            }, { passive: false });

            console.log('🎮 Breakout dengan Sound Effect!');
            console.log('🔼 Panah kiri/kanan atau A/D = gerakkan paddle');
            console.log('␣ Spasi = jeda, R = reset, M = mute/unmute');

        })();
    </script>
