<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Breakout Game - Level System</title>
    <style>
        /* ----- RESET & GLOBAL ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: #0b0e1a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* ----- KONTAINER UTAMA ----- */
        .game-wrapper {
            background: #141828;
            padding: 24px 30px 30px;
            border-radius: 28px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7), 0 0 0 2px #2a3142 inset;
            max-width: 840px;
            width: 100%;
        }

        /* ----- LOGO DI ATAS ----- */
        .logos {
            display: flex;
            justify-content: center;
            gap: 28px;
            margin-bottom: 14px;
            flex-wrap: wrap;
        }

        .logo-item {
            width: 60px;
            height: 60px;
            object-fit: contain;
            line-height: 1;
            transition: transform 0.2s ease, filter 0.2s ease;
            cursor: default;
            filter: drop-shadow(0 2px 6px rgba(255, 255, 255, 0.15));
        }

        /* ----- HEADER (Level, skor & nyawa) ----- */
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 6px 16px 6px;
            color: #c8d0e6;
            font-weight: 600;
            font-size: 1.1rem;
            letter-spacing: 0.5px;
        }

        .game-header .level span {
            color: #00f2fe;
            font-size: 1.5rem;
            margin-left: 4px;
        }

        .game-header .score span {
            color: #f7e05e;
            font-size: 1.5rem;
            margin-left: 4px;
        }

        .game-header .lives span {
            color: #ff6b7c;
            font-size: 1.5rem;
            margin-left: 4px;
        }

        /* ----- CANVAS ----- */
        #gameCanvas {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 780 / 500;
            background: #1b212f;
            border-radius: 16px;
            box-shadow: 0 0 0 2px #2f384e, 0 10px 30px rgba(0, 0, 0, 0.6);
            cursor: none;
            touch-action: none;
        }

        /* ----- TOMBOL KONTROL ----- */
        .game-controls {
            display: flex;
            justify-content: center;
            gap: 18px;
            margin-top: 18px;
            flex-wrap: wrap;
        }

        .game-controls button {
            background: #262f42;
            border: none;
            border-radius: 40px;
            color: #d0d9f0;
            font-size: 1.1rem;
            font-weight: 600;
            padding: 10px 28px;
            cursor: pointer;
            box-shadow: 0 6px 0 #10141f, 0 4px 12px rgba(0, 0, 0, 0.4);
            transition: all 0.08s ease;
            letter-spacing: 0.3px;
        }

        .game-controls button:active {
            transform: translateY(5px);
            box-shadow: 0 1px 0 #10141f;
        }

        .game-controls button:hover {
            background: #2f3a52;
            color: #ffffff;
        }

        .game-controls .mute-btn {
            background: #1f2838;
            font-size: 1.1rem;
            padding: 10px 20px;
        }

        /* ----- RESPONSIVE ----- */
        @media (max-width: 840px) {
            .game-wrapper { padding: 16px 16px 20px; border-radius: 20px; }
            .game-header { font-size: 0.95rem; padding-bottom: 12px; }
            .game-header .level span,
            .game-header .score span,
            .game-header .lives span { font-size: 1.2rem; }
            .logos { gap: 18px; margin-bottom: 10px; }
            .logo-item { width: 45px; height: 45px; }
            .game-controls button { padding: 8px 20px; font-size: 1rem; }
        }

        @media (max-width: 480px) {
            .game-wrapper { padding: 10px 10px 14px; border-radius: 14px; }
            .game-header { font-size: 0.8rem; padding-bottom: 8px; }
            .game-header .level span,
            .game-header .score span,
            .game-header .lives span { font-size: 1rem; }
            .logos { gap: 10px; margin-bottom: 6px; }
            .logo-item { width: 35px; height: 35px; }
            .game-controls { gap: 8px; }
            .game-controls button { padding: 6px 12px; font-size: 0.8rem; }
        }
    </style>
</head>
<body>

    <div class="game-wrapper">

        <!-- ===== 5 LOGO DI ATAS ===== -->
        <div class="logos">
            <img src="h.jpeg" alt="Logo 1" class="logo-item">
            <img src="one.jpeg" alt="Logo 2" class="logo-item">
            <img src="rpl.jpeg" alt="Logo 3" class="logo-item">
            <img src="smk.jpeg" alt="Logo 4" class="logo-item">
            <img src="mk.jpeg" alt="Logo 5" class="logo-item">
        </div>

        <!-- Header Level, Skor & Nyawa -->
        <div class="game-header">
            <div class="level">⚡ Level <span id="levelDisplay">1</span></div>
            <div class="score">🏆 Skor <span id="scoreDisplay">0</span></div>
            <div class="lives">❤️ Nyawa <span id="livesDisplay">3</span></div>
        </div>

        <!-- Canvas Game -->
        <canvas id="gameCanvas" width="780" height="500"></canvas>

        <!-- Tombol Kontrol -->
        <div class="game-controls">
            <button id="resetBtn">🔄 Mulai Ulang</button>
            <button id="pauseBtn">⏸️ Jeda</button>
            <button id="muteBtn" class="mute-btn">🔊 Suara</button>
        </div>

    </div>

    <script>
        (function() {
            'use strict';

            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const W = 780, H = 500;

            const levelSpan = document.getElementById('levelDisplay');
            const scoreSpan = document.getElementById('scoreDisplay');
            const livesSpan = document.getElementById('livesDisplay');
            const resetBtn = document.getElementById('resetBtn');
            const pauseBtn = document.getElementById('pauseBtn');
            const muteBtn = document.getElementById('muteBtn');

            // ============================================================
            //  SOUND ENGINE
            // ============================================================
            let audioCtx = null;
            let isMuted = false;

            function initAudio() {
                if (!audioCtx) {
                    audioCtx = new(window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
            }

            function playTone(freq, duration, type = 'square', volume = 0.12) {
                if (isMuted) return;
                try {
                    initAudio();
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = type;
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(volume, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + duration);
                } catch (e) {}
            }

            function soundPaddle() { playTone(320, 0.08, 'square', 0.12); }
            function soundBrick() { playTone(480, 0.08, 'square', 0.12); }
            function soundWall() { playTone(440, 0.06, 'square', 0.08); }
            function soundLose() {
                playTone(300, 0.20, 'sawtooth', 0.15);
                setTimeout(() => playTone(200, 0.25, 'sawtooth', 0.12), 120);
            }
            function soundLevelUp() {
                const notes = [440, 554.37, 659.25, 880]; // A4, C#5, E5, A5
                notes.forEach((freq, idx) => {
                    setTimeout(() => playTone(freq, 0.12, 'triangle', 0.15), idx * 80);
                });
            }

            function toggleMute() {
                isMuted = !isMuted;
                muteBtn.textContent = isMuted ? '🔇 Suara' : '🔊 Suara';
                if (!isMuted) initAudio();
            }

            // ----- KONSTANTA PADDLE & BRICK -----
            const PADDLE_WIDTH = 110;
            const PADDLE_HEIGHT = 16;
            const PADDLE_RADIUS = 8;
            const BALL_RADIUS = 9;

            const BRICK_COLS = 8;
            const BRICK_WIDTH = 78;
            const BRICK_HEIGHT = 20;
            const BRICK_PADDING = 6;
            const BRICK_TOP_OFFSET = 45;

            const BRICK_COLORS = [
                '#f94144', '#f8961e', '#f9c74f',
                '#90be6d', '#577590', '#9b5de5', '#f15bb5'
            ];

            // ----- STATE GAME & LEVEL -----
            let level = 1;
            let score = 0;
            let lives = 3;
            let currentBallSpeed = 5.0; // Kecepatan dasar bola

            let paddle = { x: W / 2 - PADDLE_WIDTH / 2, y: H - 40 };
            let ball = { x: W / 2, y: H - 60, dx: 0, dy: 0, radius: BALL_RADIUS };
            let bricks = [];
            let gameState = 'playing';
            let animationId = null;
            let isGameLoopRunning = false;

            let keys = { left: false, right: false };

            // Inisialisasi susunan Brick berdasarkan Tingkat Level
            function initBricks() {
                bricks = [];
                // Jumlah baris bertambah mengikuti level (Min 4 baris, Max 7 baris)
                const rows = Math.min(4 + (level - 1), 7);

                for (let row = 0; row < rows; row++) {
                    for (let col = 0; col < BRICK_COLS; col++) {
                        const x = col * (BRICK_WIDTH + BRICK_PADDING) + BRICK_PADDING / 2;
                        const y = row * (BRICK_HEIGHT + BRICK_PADDING) + BRICK_PADDING / 2 + BRICK_TOP_OFFSET;
                        bricks.push({
                            x: x, y: y,
                            w: BRICK_WIDTH, h: BRICK_HEIGHT,
                            alive: true,
                            color: BRICK_COLORS[row % BRICK_COLORS.length]
                        });
                    }
                }
            }

            function resetBall() {
                ball.x = paddle.x + PADDLE_WIDTH / 2;
                ball.y = paddle.y - BALL_RADIUS;
                const angle = (Math.random() * 0.6 + 0.2) * Math.PI; // Sudut meluncur
                
                // Kecepatan dihitung sesuai statistik level saat ini
                ball.dx = currentBallSpeed * Math.cos(angle) * (Math.random() > 0.5 ? 1 : -1);
                ball.dy = -currentBallSpeed * Math.sin(angle);
                
                if (Math.abs(ball.dx) < 1.5) {
                    ball.dx = 2.0 * (ball.dx > 0 ? 1 : -1);
                }
            }

            // Naik ke Level Berikutnya
            function nextLevel() {
                level++;
                currentBallSpeed += 0.8; // Menambah kecepatan bola secara permanen di level baru!
                soundLevelUp();
                
                paddle.x = W / 2 - PADDLE_WIDTH / 2;
                initBricks();
                resetBall();
                updateUI();
            }

            function resetGame() {
                if (animationId) {
                    cancelAnimationFrame(animationId);
                    animationId = null;
                    isGameLoopRunning = false;
                }

                level = 1;
                score = 0;
                lives = 3;
                currentBallSpeed = 5.0; // Reset kecepatan bola ke dasar

                paddle.x = W / 2 - PADDLE_WIDTH / 2;
                paddle.y = H - 40;

                gameState = 'playing';
                pauseBtn.textContent = '⏸️ Jeda';

                initBricks();
                resetBall();
                updateUI();

                if (!isGameLoopRunning) {
                    isGameLoopRunning = true;
                    gameLoop();
                }
            }

            function updateUI() {
                levelSpan.textContent = level;
                scoreSpan.textContent = score;
                livesSpan.textContent = lives;
            }

            function togglePause() {
                if (gameState === 'gameover') return;
                if (gameState === 'playing') {
                    gameState = 'paused';
                    pauseBtn.textContent = '▶️ Mainkan';
                } else if (gameState === 'paused') {
                    gameState = 'playing';
                    pauseBtn.textContent = '⏸️ Jeda';
                }
            }

            function ballBrickCollision(brick) {
                const cx = ball.x, cy = ball.y;
                const closestX = Math.max(brick.x, Math.min(cx, brick.x + brick.w));
                const closestY = Math.max(brick.y, Math.min(cy, brick.y + brick.h));
                const distX = cx - closestX;
                const distY = cy - closestY;
                return Math.sqrt(distX * distX + distY * distY) < ball.radius;
            }

            function ballPaddleCollision() {
                const px = paddle.x, py = paddle.y;
                const cx = ball.x, cy = ball.y, r = ball.radius;
                const closestX = Math.max(px, Math.min(cx, px + PADDLE_WIDTH));
                const closestY = Math.max(py, Math.min(cy, py + PADDLE_HEIGHT));
                const distX = cx - closestX;
                const distY = cy - closestY;

                if (Math.sqrt(distX * distX + distY * distY) < r) {
                    const hitPos = (ball.x - paddle.x) / PADDLE_WIDTH;
                    const clamped = Math.max(0, Math.min(1, hitPos));
                    const angle = (clamped - 0.5) * 1.3;
                    
                    // Hitung kecil pementalan
                    const currentSpeed = Math.sqrt(ball.dx * ball.dx + ball.dy * ball.dy);
                    ball.dx = currentSpeed * Math.sin(angle);
                    ball.dy = -currentSpeed * Math.cos(angle);
                    ball.y = paddle.y - ball.radius - 1;

                    soundPaddle();
                    return true;
                }
                return false;
            }

            function updatePhysics() {
                if (gameState !== 'playing') return;

                ball.x += ball.dx;
                ball.y += ball.dy;

                // Memantul Dinding Kiri/Kanan
                if (ball.x - ball.radius < 0) {
                    ball.x = ball.radius;
                    ball.dx = -ball.dx;
                    soundWall();
                } else if (ball.x + ball.radius > W) {
                    ball.x = W - ball.radius;
                    ball.dx = -ball.dx;
                    soundWall();
                }

                // Memantul Dinding Atas
                if (ball.y - ball.radius < 0) {
                    ball.y = ball.radius;
                    ball.dy = -ball.dy;
                    soundWall();
                }

                // Jatuh ke bawah (Kehilangan Nyawa)
                if (ball.y + ball.radius > H) {
                    lives--;
                    updateUI();
                    soundLose();
                    if (lives <= 0) {
                        gameState = 'gameover';
                        pauseBtn.textContent = '🔄 Main Lagi';
                        return;
                    } else {
                        resetBall();
                        return;
                    }
                }

                ballPaddleCollision();

                // Tabrakan Brick
                for (let i = 0; i < bricks.length; i++) {
                    const brick = bricks[i];
                    if (!brick.alive) continue;
                    if (ballBrickCollision(brick)) {
                        brick.alive = false;
                        score += 10 * level; // Skor lebih tinggi pada level lebih tinggi
                        updateUI();
                        soundBrick();

                        const overlapX = (ball.x < brick.x + brick.w / 2) ?
                            (ball.x + ball.radius - brick.x) :
                            (brick.x + brick.w - (ball.x - ball.radius));
                        const overlapY = (ball.y < brick.y + brick.h / 2) ?
                            (ball.y + ball.radius - brick.y) :
                            (brick.y + brick.h - (ball.y - ball.radius));

                        if (overlapX < overlapY) {
                            ball.dx = -ball.dx;
                        } else {
                            ball.dy = -ball.dy;
                        }

                        // Cek jika semua brick di level ini sudah hancur
                        const allCleared = bricks.every(b => !b.alive);
                        if (allCleared) {
                            nextLevel(); // Pindah ke kesulitan level berikutnya!
                        }
                        break;
                    }
                }

                // Pergerakan Paddle
                const PADDLE_SPEED = 8;
                if (keys.left && paddle.x > 0) {
                    paddle.x -= PADDLE_SPEED;
                    if (paddle.x < 0) paddle.x = 0;
                }
                if (keys.right && paddle.x + PADDLE_WIDTH < W) {
                    paddle.x += PADDLE_SPEED;
                    if (paddle.x + PADDLE_WIDTH > W) paddle.x = W - PADDLE_WIDTH;
                }
            }

            function draw() {
                ctx.clearRect(0, 0, W, H);

                // Draw Bricks
                for (const brick of bricks) {
                    if (!brick.alive) continue;
                    ctx.shadowColor = 'rgba(255,255,255,0.1)';
                    ctx.shadowBlur = 6;
                    ctx.fillStyle = brick.color;
                    const x = brick.x, y = brick.y, w = brick.w, h = brick.h;
                    const r = 4;
                    ctx.beginPath();
                    ctx.moveTo(x + r, y);
                    ctx.lineTo(x + w - r, y);
                    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
                    ctx.lineTo(x + w, y + h - r);
                    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
                    ctx.lineTo(x + r, y + h);
                    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
                    ctx.lineTo(x, y + r);
                    ctx.quadraticCurveTo(x, y, x + r, y);
                    ctx.closePath();
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.strokeStyle = 'rgba(255,255,255,0.2)';
                    ctx.lineWidth = 1;
                    ctx.stroke();
                }

                // Draw Paddle
                ctx.shadowColor = 'rgba(255,255,255,0.2)';
                ctx.shadowBlur = 12;
                const grad = ctx.createLinearGradient(paddle.x, paddle.y, paddle.x, paddle.y + PADDLE_HEIGHT);
                grad.addColorStop(0, '#7f9cf5');
                grad.addColorStop(1, '#4f6cdb');
                ctx.fillStyle = grad;
                ctx.beginPath();
                const px = paddle.x, py = paddle.y, pw = PADDLE_WIDTH, ph = PADDLE_HEIGHT, rad = PADDLE_RADIUS;
                ctx.moveTo(px + rad, py);
                ctx.lineTo(px + pw - rad, py);
                ctx.quadraticCurveTo(px + pw, py, px + pw, py + rad);
                ctx.lineTo(px + pw, py + ph - rad);
                ctx.quadraticCurveTo(px + pw, py + ph, px + pw - rad, py + ph);
                ctx.lineTo(px + rad, py + ph);
                ctx.quadraticCurveTo(px, py + ph, px, py + ph - rad);
                ctx.lineTo(px, py + rad);
                ctx.quadraticCurveTo(px, py, px + rad, py);
                ctx.closePath();
                ctx.fill();
                ctx.shadowBlur = 0;

                // Draw Ball
                ctx.shadowColor = '#a0c4ff';
                ctx.shadowBlur = 20;
                ctx.beginPath();
                ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
                const gradBall = ctx.createRadialGradient(
                    ball.x - 3, ball.y - 4, 2,
                    ball.x, ball.y, ball.radius + 2
                );
                gradBall.addColorStop(0, '#ffffff');
                gradBall.addColorStop(0.5, '#b8d4ff');
                gradBall.addColorStop(1, '#5a8cdf');
                ctx.fillStyle = gradBall;
                ctx.fill();
                ctx.shadowBlur = 0;

                // Draw Teks Overlay (Pause & Game Over)
                ctx.font = 'bold 34px "Segoe UI", sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';

                if (gameState === 'paused') {
                    ctx.fillStyle = 'rgba(0,0,0,0.5)';
                    ctx.fillRect(0, 0, W, H);
                    ctx.fillStyle = '#f0f4ff';
                    ctx.fillText('⏸️ JEDA', W / 2, H / 2);
                } else if (gameState === 'gameover') {
                    ctx.fillStyle = 'rgba(0,0,0,0.6)';
                    ctx.fillRect(0, 0, W, H);
                    ctx.fillStyle = '#ff6b7c';
                    ctx.fillText('💔 GAME OVER', W / 2, H / 2 - 20);
                    ctx.font = '20px "Segoe UI", sans-serif';
                    ctx.fillStyle = '#d0d9f0';
                    ctx.fillText('Mencapai Level ' + level + ' | Skor: ' + score, W / 2, H / 2 + 30);
                }
            }

            function gameLoop() {
                if (!isGameLoopRunning) return;
                updatePhysics();
                draw();
                animationId = requestAnimationFrame(gameLoop);
            }

            // Keyboard Control
            window.addEventListener('keydown', function(e) {
                if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
                if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
                if (e.key === ' ') togglePause();
                if (e.key === 'r' || e.key === 'R') resetGame();
            });

            window.addEventListener('keyup', function(e) {
                if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
                if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
            });

            // Touch / Mouse Control
            function handleMove(e) {
                if (gameState === 'gameover') return;
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                let clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const canvasX = (clientX - rect.left) * scaleX;
                paddle.x = Math.max(0, Math.min(W - PADDLE_WIDTH, canvasX - PADDLE_WIDTH / 2));
            }

            canvas.addEventListener('mousemove', handleMove);
            canvas.addEventListener('touchmove', handleMove, { passive: true });

            resetBtn.addEventListener('click', resetGame);
            pauseBtn.addEventListener('click', togglePause);
            muteBtn.addEventListener('click', toggleMute);

            resetGame();

            document.addEventListener('click', function initAudioOnClick() {
                initAudio();
                document.removeEventListener('click', initAudioOnClick);
            }, { once: true });

        })();
    </script>
</body>
</html>
